name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        # No database needed: unit tests cover pure logic only
        # (serialization, error classifiers, connection-string handling)
        # Dummy env satisfies config validation at import time (locally this
        # comes from backend/.env, which is gitignored and absent in CI).
        # Nothing connects: pools/clients are lazy, the DB layer is mocked.
        # DATABASE_URL is a dummy for the same reason: `new Pool()` at module
        # load needs a URL string, but never opens a socket for it.
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          JWT_SECRET: test-secret
          GOOGLE_CLIENT_ID: test-google-id
          GOOGLE_CLIENT_SECRET: test-google-secret
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:5000

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npx vite build
        env:
          # Build-only placeholder so import.meta.env access doesn't fail.
          # Real value is injected by Vercel at deploy time.
          VITE_API_URL: http://localhost:5000/api
