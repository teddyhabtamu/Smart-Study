  <!-- Theme pre-paint: apply the stored/OS theme before first paint so a
       dark preference never flashes light. Mirrors ThemeContext logic. -->
  <script>
    try {
      var t = localStorage.getItem('smartstudy-theme');
      if (t !== 'ivory' && t !== 'midnight-iris') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ? 'midnight-iris' : 'ivory';
      }
      document.documentElement.dataset.theme = t;
    } catch (e) { /* default (ivory) CSS applies */ }
  </script>
